<svg xmlns="http://www.w3.org/2000/svg" width="720" height="178" viewBox="0 0 720 178" role="img" aria-labelledby="timeline-title timeline-desc">
  <title id="timeline-title">CS2 project schedule</title>
  <desc id="timeline-desc">69% of project calendar time elapsed between September 18 and December 4, 2026. 24 days remaining.</desc>
  <defs>
    <clipPath id="bar-clip"><rect x="32" y="103" width="656" height="14" rx="7"/></clipPath>
    <linearGradient id="bar-fill"><stop offset="0%" stop-color="#388bfd"/><stop offset="100%" stop-color="#58a6ff"/></linearGradient>
  </defs>
  <rect x="0.75" y="0.75" width="718.5" height="176.5" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <text x="32" y="32" font-size="12" font-weight="700" letter-spacing="1.3" fill="#8b949e">PROJECT SCHEDULE</text>
    <text x="688" y="32" text-anchor="end" font-size="12" fill="#8b949e">SEP 18 — DEC 4, 2026</text>

    <text x="32" y="82" font-size="33" font-weight="700" fill="#f0f6fc">69%</text>
    <text x="130" y="80" font-size="14" fill="#8b949e">of timeline elapsed</text>
    <text x="688" y="81" text-anchor="end" font-size="14" font-weight="600" fill="#c9d1d9">24 days remaining</text>

    <rect x="32" y="103" width="656" height="14" rx="7" fill="#21262d"/>
    <g clip-path="url(#bar-clip)">
      <rect x="32" y="103" width="451.53" height="14" fill="url(#bar-fill)"/>
    </g>
    <circle cx="449.45" cy="110.0" r="4.5" fill="#0d1117" stroke="#8b949e" stroke-width="2"/>

    <text x="32" y="145" font-size="12" font-weight="600" fill="#c9d1d9">Proposal</text>
    <text x="32" y="162" font-size="11" fill="#8b949e">Sep 18</text>
    <text x="449.45" y="145" text-anchor="middle" font-size="12" font-weight="600" fill="#c9d1d9">Descriptive analysis</text>
    <text x="449.45" y="162" text-anchor="middle" font-size="11" fill="#8b949e">Nov 6</text>
    <text x="688" y="145" text-anchor="end" font-size="12" font-weight="600" fill="#c9d1d9">Final project</text>
    <text x="688" y="162" text-anchor="end" font-size="11" fill="#8b949e">Dec 4</text>
  </g>
</svg>
